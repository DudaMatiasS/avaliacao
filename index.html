<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Avaliação de sumários e tópicos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --fg:#161a22; --muted:#5d6676; --line:#dde1e8;
  --accent:#2b4fd6; --accent-fg:#ffffff; --accent-soft:#e6ebfb;
  --yes:#157a4a; --yes-soft:#dff3e8; --mid:#9a6a00; --mid-soft:#f7eed6; --no:#b4412f; --no-soft:#f8e4e0;
  --code-bg:#eef0f4;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#12151b; --surface:#1a1e26; --fg:#e8ebf1; --muted:#9aa3b4; --line:#2c323e;
  --accent:#7d98ff; --accent-fg:#0d1330; --accent-soft:#232c4f;
  --yes:#5fd39a; --yes-soft:#17382a; --mid:#e8c068; --mid-soft:#3a3018; --no:#f0897a; --no-soft:#432520;
  --code-bg:#12151b; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--sans);padding-block:0 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line);margin-bottom:4px}
.bar-row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{font-weight:600}
.brand small{font-family:var(--mono);font-weight:400;color:var(--muted);margin-left:8px}
.progress{height:4px;background:var(--line);border-radius:2px;margin-top:10px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);transition:width .2s}
.linkbtn{background:none;border:0;color:var(--muted);padding:4px 6px;text-decoration:underline;text-underline-offset:3px}
.sec{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin:0 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:14px}
.texto{font-size:16px;line-height:1.6;background:var(--code-bg);border-radius:4px;padding:14px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:42vh;overflow:auto}
.texto.alto{max-height:60vh}
.term{font-size:22px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.q{font-size:17px;font-weight:600;margin:0;text-wrap:balance}
.hint{font-size:13px;color:var(--muted);margin:0}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:4px 12px;font:500 12px var(--mono)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chip:disabled{opacity:.45;cursor:default}
textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px;width:100%;min-height:72px;resize:vertical}
.count{font:12px var(--mono);color:var(--muted)}
.count.over{color:var(--no)}
.likert{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lk{border:2px solid var(--line);background:var(--surface);border-radius:6px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-height:76px;font-size:13px;line-height:1.25}
.lk b{font-size:18px}
.lk1:hover,.lk1.on,.lk2:hover,.lk2.on{border-color:var(--no);background:var(--no-soft);color:var(--no)}
.lk3:hover,.lk3.on{border-color:var(--muted);background:var(--code-bg)}
.lk4:hover,.lk4.on,.lk5:hover,.lk5.on{border-color:var(--yes);background:var(--yes-soft);color:var(--yes)}
@media (max-width:560px){.likert{grid-template-columns:1fr}.lk{flex-direction:row;justify-content:flex-start;text-align:left;min-height:48px;padding:8px 14px}.lk b{min-width:24px}}
.crit{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.crit h3{margin:0;font-size:16px}
.crit p{margin:0}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:6px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;text-align:left}
.opt b{font-size:20px;min-width:22px;line-height:1.2}
.o0:hover,.o0.on{border-color:var(--yes);background:var(--yes-soft);color:var(--yes)}
.o1:hover,.o1.on{border-color:var(--mid);background:var(--mid-soft);color:var(--mid)}
.o2:hover,.o2.on{border-color:var(--no);background:var(--no-soft);color:var(--no)}
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:500}
.btn:disabled{opacity:.5;cursor:default}
.status{font-family:var(--mono);font-size:12px;color:var(--muted)}
.status.err,.err{color:var(--no)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
h1{font-size:22px;margin:0;line-height:1.25}
.lead{color:var(--muted);margin:0;max-width:62ch}
.intro{max-width:none}
.intro p,.intro ul{margin:0;max-width:68ch}
.intro ul{padding-left:20px;display:flex;flex-direction:column;gap:6px}
.intro h2{font-size:15px;margin:6px 0 0}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.person{border:2px solid var(--line);background:var(--surface);border-radius:6px;padding:16px 10px;font-size:18px;font-weight:600;overflow-wrap:anywhere}
.person:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
</style></head>
<body><div class="wrap" id="app"><div class="card"><p class="lead">Carregando…</p></div></div>
<script src="config.js"></script>
<script>
const CFG = window.SUM_CONFIG;
const MAXP = Number(CFG.TOPICO_MAX_PALAVRAS) || 0;
const $app = document.getElementById("app");

/* ---------- textos das perguntas (edite aqui) ---------- */
const PERGUNTA_TOPICO = "What is the main topic addressed in the transcript?";
const PERGUNTA_NOTA = "Quão precisamente o tópico abaixo descreve a transcrição?";
const NOTA_TOPICO = [
  [0, "Representa o tópico principal de forma precisa e com especificidade adequada."],
  [1, "Representa um aspecto relevante relacionado à transcrição, mas é muito amplo ou muito específico, ou não captura o aspecto central."],
  [2, "Não representa adequadamente o tópico principal ou não tem nada a ver."]
];
const LIKERT = [[1,"Discordo fortemente"],[2,"Discordo"],[3,"Nem discordo nem concordo"],[4,"Concordo"],[5,"Concordo fortemente"]];
const CRITERIOS = [
  ["consistencia","1. Consistência factual","O sumário contém apenas informações presentes no texto original? Ele evita criar dados ou distorcer fatos (alucinações)?"],
  ["cobertura","2. Cobertura","Os pontos principais e as ideias centrais do texto original foram incluídos? Detalhes irrelevantes foram descartados?"],
  ["concisao","3. Concisão","O sumário vai direto ao ponto? Há redundâncias, repetições ou excesso de palavras?"]
];
/* Etapas ativas, na ordem (definidas no config.js). "nota" só funciona depois de "topico". */
const ETAPAS = (()=>{ let e=(CFG.ETAPAS||["sumario"]).filter(s=>["sumario","topico","nota"].includes(s));
  if(e.includes("nota")&&!(e.includes("topico")&&e.indexOf("topico")<e.indexOf("nota"))) e=e.filter(s=>s!=="nota");
  return e.length?e:["sumario"]; })();
const TXT_ETAPA = {
  sumario:"<strong>Sumário:</strong> leia a transcrição e o sumário gerado automaticamente e avalie consistência factual, cobertura e concisão (de 1 a 5).",
  topico:`<strong>Tópico:</strong> leia a transcrição e escreva, com suas palavras, o tópico principal${MAXP?` (até ${MAXP} palavras)`:""}. Depois de enviado, o tópico não pode ser alterado.`,
  nota:"<strong>Avaliar tópico:</strong> você verá um tópico gerado automaticamente e indicará quão bem ele descreve a transcrição (0, 1 ou 2)."
};
const INSTRUCOES_HTML = `
<p>Prezado(a) participante,</p>
<p>Você está sendo convidado(a) a participar da pesquisa “Crianças e Adolescentes em Plataformas de Mídias Sociais: Perigos, Desafios e Oportunidades”, realizada no Departamento de Ciência da Computação (DCC) da Universidade Federal de Minas Gerais (UFMG), sob a coordenação da professora Jussara Marques de Almeida.</p>
<p>O projeto busca contribuir para que as plataformas de mídias sociais sejam ambientes mais seguros para crianças e adolescentes. Nesta etapa da pesquisa, convidamos você a responder a um questionário on-line. O objetivo é avaliar se os resumos, as palavras-chave e as etiquetas descritivas (<em>tags</em>) apresentados no questionário representam com fidelidade o conteúdo de transcrições de vídeos do TikTok.</p>
<h2>Sobre as transcrições</h2>
<p>As transcrições são de vídeos públicos do TikTok coletados por meio da interface oficial de coleta de dados da plataforma (API). Os vídeos selecionados estão associados a hashtags relacionadas a histórias com personagens em forma de frutas, também conhecidas como “novelas de frutas”.</p>
<h2>O que você vai fazer</h2>
<p>Em cada questão, você lerá a transcrição de um vídeo e avaliará o material apresentado com ela. Se a questão apresentar um resumo, você avaliará em que medida ele expressa o que foi dito na transcrição. Se apresentar palavras-chave ou etiquetas descritivas, você avaliará em que medida elas correspondem ao conteúdo do texto. Siga as orientações de cada questão.</p>
<p>Seu progresso será salvo. Caso faça uma pausa, você poderá retomar o questionário mais tarde, inclusive em outro dispositivo.</p>
<h2>Participação voluntária e possíveis riscos</h2>
<p>Sua participação é voluntária. Durante a atividade, você poderá sentir cansaço ou desconforto. Algumas transcrições podem conter linguagem pejorativa, manifestações de discriminação, como homofobia e racismo, ou relatos potencialmente perturbadores.</p>
<p>Você pode deixar qualquer pergunta sem resposta, fazer uma pausa ou encerrar sua participação a qualquer momento, sem qualquer prejuízo. Caso sofra algum dano decorrente de sua participação na pesquisa, você tem direito a buscar indenização.</p>
<h2>Dados coletados e uso das respostas</h2>
<p>Você não precisará fornecer informações pessoais para participar. Caso informe espontaneamente algum dado pessoal, a equipe de pesquisa o manterá em sigilo.</p>
<p>As respostas serão utilizadas na construção de uma taxonomia, ou seja, um conjunto organizado de categorias, e no posterior desenvolvimento de um método para detectar riscos e danos relacionados aos conteúdos das mídias sociais. Os resultados poderão ser divulgados em publicações científicas, preservando-se a identidade dos participantes.</p>
<p>A equipe de pesquisa armazenará os dados em formato digital na UFMG por cinco anos após o término da pesquisa, conforme previsto na Resolução CNS nº 466/2012. Ao final desse período, a equipe destruirá os dados.</p>
<h2>Custos e benefícios</h2>
<p>A participação não terá custo financeiro para você. Não haverá pagamento pela participação nem benefício pessoal direto.</p>
<p>Sua avaliação ajudará a equipe a compreender em que medida os resumos, as palavras-chave e as etiquetas descrevem com fidelidade o conteúdo dos vídeos. Os resultados poderão contribuir, de forma indireta, para o desenvolvimento de métodos de identificação de conteúdos potencialmente prejudiciais a crianças e adolescentes nas mídias sociais.</p>
<h2>Consentimento</h2>
<p>Ao prosseguir para o questionário, você manifesta sua concordância em participar desta pesquisa. Recomendamos que você guarde uma cópia deste Termo de Consentimento Livre e Esclarecido (TCLE) para consultá-lo quando desejar.</p>
<h2>Contatos para dúvidas sobre a pesquisa</h2>
<ul>
<li><strong>Kênia Carolina Gonçalves</strong>: keniacarolina@dcc.ufmg.br</li>
<li><strong>Professora Jussara Marques de Almeida</strong>: jussara@dcc.ufmg.br | (31) 3409-5860<br>Departamento de Ciência da Computação, prédio do ICEx, Universidade Federal de Minas Gerais. Av. Presidente Antônio Carlos, 6627, Pampulha, Belo Horizonte – MG, CEP 31270-901.</li>
</ul>
<h2>Contato para dúvidas sobre questões éticas</h2>
<p><strong>Comitê de Ética em Pesquisa da UFMG (CEP-UFMG)</strong><br>coep@prpq.ufmg.br | (31) 3409-4592<br>Av. Presidente Antônio Carlos, 6627, Unidade Administrativa II, 2º andar, sala 2005, Pampulha, Belo Horizonte – MG, CEP 31270-901.</p>`;

/* ---------- utilitários ---------- */
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (k==="class") el.className=v; else if (k.startsWith("on")) el.addEventListener(k.slice(2),v);
    else if (v!==false && v!=null) el.setAttribute(k,v===true?"":v);
  }
  for (const c of kids.flat()) if (c!=null && c!==false) el.append(c.nodeType?c:document.createTextNode(c));
  return el;
}
const ls = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}} };
const RPC = CFG.SUPABASE_URL.replace(/\/+$/,"").replace(/\/rest\/v1$/,"") + "/rest/v1/rpc/";
const HDR = { apikey:CFG.SUPABASE_ANON_KEY, "Content-Type":"application/json" };
if (/^eyJ/.test(CFG.SUPABASE_ANON_KEY)) HDR.Authorization = "Bearer " + CFG.SUPABASE_ANON_KEY;
async function rpc(fn, body){
  const r = await fetch(RPC+fn, {method:"POST", headers:HDR, body:JSON.stringify(body)});
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}
function contaPalavras(t){ const s=String(t||"").trim(); return s ? s.split(/\s+/).length : 0; }

/* ---------- estado ---------- */
const NOME_ETAPA = {topico:"Tópico", nota:"Avaliar tópico", sumario:"Sumário"};
const CAMPOS_ETAPA = {sumario:["consistencia","cobertura","concisao"], topico:["topico_humano"], nota:["topico_nota"]};
const S = { ann:null, itens:[], idx:0, step:"topico", view:"", pending:[], flushing:false, saveErr:null, rasc:{}, enviando:false, erroTopico:null };
const KEY = "sum_pending";

function feita(it,s){ return CAMPOS_ETAPA[s].every(c=>it[c]!=null); }
function etapaMax(it){ return ETAPAS.find(s=>!feita(it,s)) || ETAPAS[ETAPAS.length-1]; }
function completo(it){ return ETAPAS.every(s=>feita(it,s)); }
// Depois de concluir a etapa atual: vai para a próxima etapa ou para o próximo item pendente.
function avancar(it){
  if(S.view!=="item"||S.itens[S.idx]!==it) return;
  const k=ETAPAS.indexOf(S.step);
  if(k>=0&&k<ETAPAS.length-1){ S.step=ETAPAS[k+1]; renderItem(); return; }
  const prox=S.itens.findIndex((x,j)=>j>S.idx&&!completo(x)), alvo=prox>=0?prox:S.itens.findIndex(x=>!completo(x));
  if(alvo>=0) go(alvo); else renderItem(true);
}

function init(){
  try{ S.pending = JSON.parse(ls.get(KEY)||"[]").filter(p=>p&&p.a&&p.item&&p.v); }catch(e){ S.pending=[]; }
  renderIntro(()=>renderPeople(), "Concordo com TCLE e desejo prosseguir");
}
function renderMsg(t){ $app.replaceChildren(h("div",{class:"card"},h("p",{class:"lead"},t))); }
function brand(sub){ return h("div",{class:"brand"},"Avaliação",h("small",{},sub)); }

/* ---------- instruções ---------- */
function renderIntro(next,label){
  S.view="intro";
  const box=h("div",{class:"intro",style:"display:flex;flex-direction:column;gap:12px"}); box.innerHTML=INSTRUCOES_HTML;   // texto fixo deste arquivo
  $app.replaceChildren(h("div",{class:"topbar"},h("div",{class:"bar-row"},brand("sumários e tópicos"))),
    h("div",{class:"card"},h("h1",{},"Termo de Consentimento Livre e Esclarecido (TCLE) e instruções"),box,h("div",{class:"row"},h("button",{class:"btn primary",onclick:next},label))));
  window.scrollTo(0,0);
}

/* ---------- escolha do nome ---------- */
async function renderPeople(msg){
  S.view="people"; S.ann=null; renderMsg("Carregando…");
  let list;
  try{ list = await rpc("sum_listar_anotadores",{}); }
  catch(e){ return $app.replaceChildren(h("div",{class:"card"},h("p",{class:"lead"},"Não consegui conectar ao servidor ("+e.message+"). Confira a internet e tente de novo."),
    h("div",{class:"row"},h("button",{class:"btn primary",onclick:()=>renderPeople()},"Tentar de novo")))); }
  flush();
  $app.replaceChildren(
    h("div",{class:"topbar"},h("div",{class:"bar-row"},brand("sumários e tópicos"),
      h("button",{class:"linkbtn",onclick:()=>renderIntro(()=>renderPeople(),"Voltar")},"Ver TCLE e instruções"))),
    h("div",{class:"card"},
      h("h1",{},"Quem é você?"),
      h("p",{class:"lead"},"Clique no seu nome para começar ou continuar de onde parou."),
      msg?h("div",{class:"err"},msg):null,
      list.length ? h("div",{class:"people"},list.map(p=>h("button",{class:"person",onclick:()=>enter(p)},p.nome)))
                  : h("p",{class:"hint"},"Nenhum anotador cadastrado ainda.")));
}
async function enter(p){
  renderMsg("Entrando…");
  let d;
  try{ d = await rpc("sum_entrar",{p_anotador:p.id}); }
  catch(e){ return renderPeople("Não consegui conectar ao servidor ("+e.message+"). Tente de novo."); }
  if(!d) return renderPeople("Anotador não encontrado. Atualize a página.");
  S.ann=d.anotador; S.saveErr=null; S.rasc={}; S.erroTopico=null;
  S.itens=d.itens.map(x=>({...x}));
  for(const p of S.pending) if(p.a===S.ann.id){ const it=S.itens.find(x=>x.item===p.item); if(it) Object.assign(it,p.v); }
  const first=S.itens.findIndex(x=>!completo(x));
  go(first<0?0:first);
  flush();
}

/* ---------- navegação ---------- */
function go(i){
  S.idx=Math.max(0,Math.min(S.itens.length-1,i)); S.erroTopico=null;
  const it=S.itens[S.idx]; S.step=it?etapaMax(it):"topico";
  renderItem();
}
function setStep(s){ S.step=s; renderItem(); }

/* ---------- tela do item ---------- */
function renderItem(keepScroll){
  S.view="item";
  const y=window.scrollY;
  const n=S.itens.length, done=S.itens.filter(completo).length;
  const topbar=h("div",{class:"topbar"},
    h("div",{class:"bar-row"},brand(`${S.ann.nome} · ${done}/${n} concluídos`),
      h("div",{class:"row"},
        h("button",{class:"linkbtn",onclick:()=>renderIntro(()=>renderItem(),"Voltar")},"Ver TCLE e instruções"),
        h("button",{class:"linkbtn",onclick:()=>renderPeople()},"Trocar de pessoa"))),
    h("div",{class:"progress"},h("i",{style:`width:${n?100*done/n:0}%`})));
  if(!n){ $app.replaceChildren(topbar,h("div",{class:"card"},h("p",{class:"lead"},"Ainda não há itens para você. Avise quem coordena o projeto."))); return; }

  const it=S.itens[S.idx], max=ETAPAS.indexOf(etapaMax(it));
  if(ETAPAS.indexOf(S.step)>max) S.step=ETAPAS[max];
  const steps=ETAPAS.length<2?null:h("div",{class:"steps"},ETAPAS.map((s,k)=>h("button",{class:"chip"+(s===S.step?" on":""),disabled:k>max?true:null,onclick:()=>setStep(s)},`${k+1}. ${NOME_ETAPA[s]}`)));
  const transc=h("div",{},h("div",{class:"sec"},`Transcrição · item ${S.idx+1} de ${n}`),
    h("div",{class:"texto"+(S.step==="topico"?" alto":"")},it.transcricao));

  let body;
  if(S.step==="topico") body=etapaTopico(it);
  else if(S.step==="nota") body=etapaNota(it);
  else body=etapaSumario(it);

  const fin = done===n ? h("div",{class:"card"},h("strong",{},"Você concluiu todos os itens. Obrigado!"),
    h("p",{class:"lead"},"Pode revisar as notas; mudar uma nota sobrescreve a anterior.")) : null;
  const st=h("span",{id:"st",class:"status"+(S.saveErr?" err":"")},statusText());
  const nav=h("div",{class:"nav"},
    h("button",{class:"btn",disabled:S.idx===0?true:null,onclick:()=>go(S.idx-1)},"← Item anterior"), st,
    h("button",{class:"btn",disabled:S.idx>=n-1?true:null,onclick:()=>go(S.idx+1)},"Próximo item →"));

  $app.replaceChildren(...[topbar,fin,h("div",{class:"card"},steps,transc),body,nav].filter(Boolean));
  window.scrollTo(0,keepScroll?y:0);
  if(S.step==="topico"&&it.topico_humano==null){ const ta=document.getElementById("ta"); if(ta&&!keepScroll) ta.focus({preventScroll:true}); }
}

function etapaTopico(it){
  if(it.topico_humano!=null){
    return h("div",{class:"card"},h("p",{class:"q"},PERGUNTA_TOPICO),
      h("div",{class:"sec",style:"margin:0"},"Seu tópico (enviado)"),h("div",{class:"term"},it.topico_humano),
      h("div",{class:"row"},h("button",{class:"btn primary",onclick:()=>avancar(it)},"Continuar →")));
  }
  const ta=h("textarea",{id:"ta",rows:"2",placeholder:"Escreva o tópico principal"});
  ta.value=S.rasc[it.item]||"";
  const cnt=h("span",{class:"count"}), btn=h("button",{class:"btn primary",onclick:()=>enviarTopico(it,ta.value)},"Enviar tópico");
  const upd=()=>{ S.rasc[it.item]=ta.value; const w=contaPalavras(ta.value), over=MAXP&&w>MAXP;
    cnt.textContent=MAXP?`${w}/${MAXP} palavras`:`${w} palavras`; cnt.className="count"+(over?" over":"");
    btn.disabled=S.enviando||!w||over; };
  ta.addEventListener("input",upd);
  ta.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); if(!btn.disabled) btn.click(); } });
  upd();
  return h("div",{class:"card"},
    h("p",{class:"q"},PERGUNTA_TOPICO),
    h("p",{class:"hint"},(MAXP?`Responda em até ${MAXP} palavras. `:"")+"Depois de enviar, não é possível alterar."),
    ta, h("div",{class:"row",style:"justify-content:space-between"},cnt,btn),
    S.erroTopico?h("div",{class:"err"},S.erroTopico):null);
}
async function enviarTopico(it,txt){
  txt=String(txt||"").trim(); const w=contaPalavras(txt);
  if(!w||(MAXP&&w>MAXP)||S.enviando) return;
  S.enviando=true; S.erroTopico=null; renderItem(true);
  try{
    const r=await rpc("sum_salvar_topico",{p_anotador:S.ann.id,p_item:it.item,p_topico:txt});
    Object.assign(it,{topico_humano:r.topico_humano,topico_llm:r.topico_llm,sumario:r.sumario});
    delete S.rasc[it.item]; S.enviando=false;
    avancar(it);
  }catch(e){
    S.enviando=false; S.erroTopico="Não consegui enviar ("+e.message+"). Seu texto continua aqui; tente de novo.";
    if(S.view==="item") renderItem(true);
  }
}

function etapaNota(it){
  const cur=it.topico_nota;
  return h("div",{class:"card"},
    h("div",{},h("div",{class:"sec"},"Tópico"),h("div",{class:"term"},it.topico_llm)),
    h("p",{class:"q"},PERGUNTA_NOTA),
    h("p",{class:"hint"},"Atalho: teclas 0, 1 e 2."),
    h("div",{class:"opts",role:"radiogroup","aria-label":PERGUNTA_NOTA},
      NOTA_TOPICO.map(([v,t])=>h("button",{class:`opt o${v}`+(cur===v?" on":""),role:"radio","aria-checked":cur===v?"true":"false",onclick:()=>notaTopico(v)},h("b",{},String(v)),h("span",{},t)))));
}
function notaTopico(v){
  const it=S.itens[S.idx]; if(!it||it.topico_humano==null) return;
  queue(it,"topico_nota",v); renderItem(true);
  setTimeout(()=>{ if(S.step==="nota") avancar(it); },250);
}

function etapaSumario(it){
  return h("div",{class:"card"},
    h("div",{},h("div",{class:"sec"},"Sumário"),h("div",{class:"texto"},it.sumario)),
    h("p",{class:"hint"},"Indique o quanto você concorda com cada afirmação sobre o sumário."),
    CRITERIOS.map(([campo,titulo,perg])=>h("div",{class:"crit"},
      h("h3",{},titulo),h("p",{},perg),
      h("div",{class:"likert",role:"radiogroup","aria-label":titulo},
        LIKERT.map(([v,t])=>h("button",{class:"lk lk"+v+(it[campo]===v?" on":""),role:"radio","aria-checked":it[campo]===v?"true":"false",
          onclick:()=>notaSumario(it,campo,v)},h("b",{},String(v)),h("span",{},t)))))));
}
function notaSumario(it,campo,v){
  const antes=feita(it,"sumario");
  queue(it,campo,v); renderItem(true);
  if(!antes&&feita(it,"sumario")) setTimeout(()=>{ if(S.step==="sumario") avancar(it); },350);
}

/* ---------- salvamento das notas (fila com reenvio) ---------- */
function statusText(){
  if(S.saveErr) return S.saveErr;
  if(S.pending.length) return "salvando…";
  const it=S.itens[S.idx]; return it&&Object.values(CAMPOS_ETAPA).flat().some(c=>it[c]!=null)?"salvo":"";
}
function updateStatus(){ const el=document.getElementById("st"); if(!el) return; el.textContent=statusText(); el.className="status"+(S.saveErr?" err":""); }
function queue(it,campo,valor){
  it[campo]=valor; S.saveErr=null;
  let p=S.pending.find(p=>p.a===S.ann.id&&p.item===it.item);
  if(!p){ p={a:S.ann.id,item:it.item,v:{}}; S.pending.push(p); }
  p.v[campo]=valor; ls.set(KEY,JSON.stringify(S.pending)); flush();
}
async function flush(){
  if(S.flushing||!S.pending.length) return; S.flushing=true; updateStatus();
  try{
    while(S.pending.length){
      const who=S.pending[0].a, batch=S.pending.filter(p=>p.a===who).slice(0,50);
      const sent=batch.map(p=>JSON.stringify(p.v));
      await rpc("sum_salvar",{p_anotador:who,p_respostas:batch.map(p=>({item:p.item,...p.v}))});
      S.pending=S.pending.filter(p=>{ const k=batch.indexOf(p); return k<0||JSON.stringify(p.v)!==sent[k]; });
      ls.set(KEY,JSON.stringify(S.pending));
    }
    S.saveErr=null;
  }catch(e){ S.saveErr="Sem conexão com o servidor. Suas notas ficam neste navegador e serão reenviadas."; setTimeout(flush,8000); }
  S.flushing=false; updateStatus();
}

document.addEventListener("keydown",e=>{
  if(S.view!=="item"||S.step!=="nota"||e.metaKey||e.ctrlKey||e.altKey) return;
  if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||"")) return;
  if(/^[0-2]$/.test(e.key)) notaTopico(Number(e.key));
});
window.addEventListener("online",flush);
init();
</script></body></html>
